name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  verify:
    name: Verify locked dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build library
        run: npm run build

      - name: Run tests
        run: npm test -- --runInBand

  compatibility:
    name: Compatibility (NestJS ${{ matrix.nest-version }}, Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 20, 22, 24 ]
        nest-version: [ 12 ]
        piscina-version: [ 5 ]
        reflect-version: [ '0.2' ]
        include:
          - node-version: 22
            nest-version: 9
            piscina-version: 4
            reflect-version: '0.1'
          - node-version: 18
            nest-version: 10
            piscina-version: 4
            reflect-version: '0.2'
          - node-version: 22
            nest-version: 11
            piscina-version: 5
            reflect-version: '0.2'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install compatibility versions
        run: >-
          npm install --no-save
          @nestjs/common@${{ matrix.nest-version }}
          @nestjs/core@${{ matrix.nest-version }}
          @nestjs/testing@${{ matrix.nest-version }}
          piscina@${{ matrix.piscina-version }}
          reflect-metadata@${{ matrix.reflect-version }}

      - name: Typecheck
        run: npm run typecheck

      - name: Build library
        run: npm run build

      - name: Run tests
        run: npm test -- --runInBand

  status-check:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [ lint, verify, compatibility ]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.verify.result }}" != "success" ] || \
             [ "${{ needs.compatibility.result }}" != "success" ]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully"
